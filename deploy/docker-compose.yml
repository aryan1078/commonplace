name: collab
x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: collab-platform:submission
services:
  node1:
    <<: *app
    command: ["docnode", "--port", "50051", "--address", "node1:50051", "--peers", "node1:50051,node2:50051,node3:50051", "--data-dir", "/data"]
    volumes: ["node1-data:/data"]
    ports: ["50051:50051"]
  node2:
    <<: *app
    command: ["docnode", "--port", "50051", "--address", "node2:50051", "--peers", "node1:50051,node2:50051,node3:50051", "--data-dir", "/data"]
    volumes: ["node2-data:/data"]
    ports: ["50052:50051"]
  node3:
    <<: *app
    command: ["docnode", "--port", "50051", "--address", "node3:50051", "--peers", "node1:50051,node2:50051,node3:50051", "--data-dir", "/data"]
    volumes: ["node3-data:/data"]
    ports: ["50053:50051"]
  assist:
    <<: *app
    command: ["assist"]
    environment:
      ASSIST_PROVIDER: "${ASSIST_PROVIDER:-llama_cpp}"
      ASSIST_MODEL_PATH: /models/qwen.gguf
    volumes: ["../models:/models:ro"]
    ports: ["50061:50061"]
  gateway:
    <<: *app
    command: ["gateway", "--docnodes", "node1:50051,node2:50051,node3:50051", "--assist", "assist:50061"]
    ports: ["50070:50070"]
  client:
    <<: *app
    profiles: ["client"]
    entrypoint: ["python", "run.py", "client"]
    environment:
      COLLAB_GATEWAY: gateway:50070
    stdin_open: true
    tty: true
volumes:
  node1-data:
  node2-data:
  node3-data:
