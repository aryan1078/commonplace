syntax = "proto3";
package collab.v1;
service RaftService {
 rpc RequestVote(VoteRequest) returns (VoteReply);
 rpc AppendEntries(AppendRequest) returns (AppendReply);
 rpc Status(StatusRequest) returns (StatusReply);
}
message Entry { uint64 term = 1; bytes command = 2; }
message VoteRequest { uint64 term = 1; string candidate = 2; uint64 last_index = 3; uint64 last_term = 4; }
message VoteReply { uint64 term = 1; bool granted = 2; }
message AppendRequest {
 uint64 term = 1; string leader = 2; uint64 prev_index = 3; uint64 prev_term = 4;
 repeated Entry entries = 5; uint64 commit = 6;
}
message AppendReply { uint64 term = 1; bool success = 2; uint64 match_index = 3; }
message StatusRequest { string doc_id = 1; }
message StatusReply {
 string node = 1; string role = 2; uint64 term = 3; string leader = 4;
 uint64 last_index = 5; uint64 commit_index = 6; uint64 applied_index = 7;
 uint64 revision = 8; string digest = 9;
}
